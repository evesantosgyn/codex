fatos_de_canone:
  - "Olivia sabia que o estúdio era o de Claire antes de bater na porta (P14); não contou."
  - "Claire mora no mesmo apartamento há sete anos ou mais; Olivia conhece o prédio e o porteiro (P15)."
  - "June conhece o segredo de Olivia."
  - "Olivia também nunca apagou o número de Claire (N41, EP03)."
  - "Olivia guardou por sete anos uma caixa de metal de negativos com adesivos de bagagem; a foto da parede de Claire (V55) é deste rolo; Claire tem a única cópia impressa (N41)."
  - "Maya conhece Olivia de nome como 'a ex' de Claire, mas não o sobrenome até a SC006."

eventos_revelados_ate_ep01:
  - Claire ainda guarda o número antigo de Olivia (SC004).
  - Olivia voltou a Manhattan para um documentário sobre a restauração do empreendimento.
  - Claire descobre que Olivia é a documentarista do projeto (SC006).
  - Maya sabe que Olivia é "the ex" (SC007).
  - June encontra os registros originais de aquisição; Olivia reconhece um documento de sete anos antes (SC009).
  - Claire ainda NÃO sabe da ligação do documento com o passado ("Not yet").

pontas_abertas:
  - O documento antigo da SC009 e a "familiar company name".
  - Claire ainda não perguntou se Olivia sabia que o projeto era dela (P14), material para o EP02.
  - Olivia não explicou por que partiu nem se desculpou (SC005).
  - Regras de convivência de Claire (SC007): sem conversas pessoais no horário de trabalho, sem surpresas.
